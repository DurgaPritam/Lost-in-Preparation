# Quality gates for the website (site/). Reads only site-data/ and contract/ at build time; no secrets are needed.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'site-data/**', 'contract/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'site-data/**', 'contract/**', '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type-check (contract types regenerated from the JSON Schemas)
        run: npm run typecheck
      - name: Lint (includes the design-token rule)
        run: npm run lint
      - name: Unit tests (selectors, formatting, contract validation)
        run: npm test
      - name: Build (fails on any site-data file that does not match the contract)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E journeys, axe accessibility, honesty checks (desktop and 390px)
        run: npm run e2e
        env:
          CI: 'true'
      - name: Lighthouse (performance, accessibility, best practices >= 90, median of 3 runs)
        run: npm run lighthouse
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-reports
          path: |
            site/playwright-report
            site/test-results
            site/.lighthouseci
          retention-days: 7
          include-hidden-files: true
