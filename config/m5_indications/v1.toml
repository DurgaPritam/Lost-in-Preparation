# M5 indication lexicon, version 1 (2026-11-06): historical indication wording -> MeSH descriptor.
#
# HEURISTIC. Used by pipeline/lip/m5/pairs.py to turn a recipe's verbatim indication (indicationAsWritten) into one
# or more MeSH descriptors, which define the species–indication pairs of the Phase 5 audit and the PubMed queries.
# - Keys are MeSH descriptor names. The MeSH unique ID of every key is looked up live in NCBI's MeSH database
#   (E-utilities, db=mesh) and cached; a key not found exactly is dropped and reported, never guessed.
# - Values are case-insensitive regular expressions over the historical wording. One indication can map to several
#   descriptors (a list of conditions). Wording that matches nothing is left unmapped and counted, not forced.
# - Historical terms do not equal modern diagnoses ("ague" is not a diagnosis of malaria; Culpeper's "cancers" are
#   usually ulcers and are mapped to Skin Ulcer, not Neoplasms). The mapping only chooses which modern literature to
#   audit; it never asserts that a remedy treats the modern condition.
# Changes: never edit a published version; copy to v2.toml and record the change below.

version = "v1"

